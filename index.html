<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finanzas Familiares</title>
<meta name="description" content="Control de gastos mensuales con tope de $400">
<meta name="theme-color" content="#0e9f6e">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header>
  <h1>Finanzas Familiares</h1>
  <div class="sub">Control de gastos · tope mensual</div>
</header>
<main>
  <section id="vdash" class="view"><div id="dash"></div></section>
  <section id="vform" class="view"><div id="form"></div></section>
  <section id="vhist" class="view"><div id="hist"></div></section>
  <section id="vset" class="view"><div id="set"></div></section>
</main>
<nav>
  <button data-v="dash" class="on"><span class="ico">📊</span>Panel</button>
  <button data-v="form"><span class="ico">➕</span>Agregar</button>
  <button data-v="hist"><span class="ico">🧾</span>Historial</button>
  <button data-v="set"><span class="ico">⚙️</span>Ajustes</button>
</nav>
<script src="./app.js"></script>
</body>
</html>
